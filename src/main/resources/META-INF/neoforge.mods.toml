modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="nicomar"
description='''
Bloques pintables subdivididos, diseños persistentes y catálogo decorativo para Minecraft 26.2.
Herramientas, producción, pendientes y pinturas de cristal implementadas en código; verificación dentro de Minecraft pendiente.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version}]"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jade"
type="optional"
versionRange="[26.2.10,)"
ordering="AFTER"
side="CLIENT"

[features.${mod_id}]
javaVersion="[25,)"
